[package]
name = "torch-converter"
version = "0.1.0"
edition = "2024"
description = "Torch Mod Converter: a window over torch-convert and the port agent, with live progress"
license = "MIT"
publish = false

# Its own workspace: a desktop tool, never built with the client.
[workspace]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
