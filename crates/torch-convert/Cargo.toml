[package]
name = "torch-convert"
version = "0.1.0"
edition = "2024"
description = "Converts NeoForge mod jars into .torchmod packages the Torch client loads"
license = "MIT"
publish = false

# Its own workspace: the client never builds or links it.
[workspace]

[dependencies]
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
