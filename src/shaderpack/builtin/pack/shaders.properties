# Torch Vibrant: the built-in pack, written in WGSL for this engine.

# The deferred pass paints the sky; only the stars, sun and moon are drawn.
sky=false
sun=true
moon=true
stars=true

shadowTerrain=true
shadowTranslucent=false
shadowSolidBackFaces=true
shadowEntities=true
shadowBlockEntities=true

oldLighting=false
separateAo=false

# The texel cache: a count, then keys, shades and the work list, each
# 2^20 entries.
bufferObject.0=12582928

# Light shafts (colortex4) and reflections (colortex5) at a fraction of the
# screen.
#if VOLUMETRIC_RES == 1
size.buffer.colortex4=1.0 1.0
#elif VOLUMETRIC_RES == 3
size.buffer.colortex4=0.3334 0.3334
#elif VOLUMETRIC_RES == 4
size.buffer.colortex4=0.25 0.25
#else
size.buffer.colortex4=0.5 0.5
#endif
#if REFLECTION_RES == 1
size.buffer.colortex5=1.0 1.0
#elif REFLECTION_RES == 3
size.buffer.colortex5=0.3334 0.3334
#elif REFLECTION_RES == 4
size.buffer.colortex5=0.25 0.25
#else
size.buffer.colortex5=0.5 0.5
#endif

# Lit as drawn: the texel target must not blend.
blend.gbuffers_textured.colortex2=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_water.colortex3=off

screen=SUN_BRIGHTNESS TORCH_BRIGHTNESS EXPOSURE FOG_DENSITY GOD_RAY_STEPS REFLECTION_STEPS SHADOW_SOFTNESS <empty> REFLECTION_RES VOLUMETRIC_RES SCALED_RESOLVE
