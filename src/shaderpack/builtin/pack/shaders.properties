# Torch Vibrant: the built-in pack, written in WGSL for this engine.

# The deferred pass paints the sky; only the stars, sun and moon are drawn.
sky=false
sun=true
moon=true
stars=true

shadowTerrain=true
shadowTranslucent=false
shadowSolidBackFaces=true
shadowEntities=true
shadowBlockEntities=true

oldLighting=false
separateAo=false

# The texel cache: a count, then keys, shades and the work list, each
# 2^20 entries. Not on Android, whose PowerVR driver aborts on the depth
# texture its compute passes read: `deferred` looks shadows up per pixel
# there instead.
#ifdef MC_OS_ANDROID
program.prepare.enabled=false
program.deferred_a.enabled=false
program.deferred_b.enabled=false
#else
bufferObject.0=12582928
# The texel shadows' temporal history: a tag and a packed shade (16 bits),
# sample count (8) and last frame seen (8) for each of 2^20 slots, kept
# from frame to frame.
bufferObject.1=8388608
#endif

# Light shafts (colortex4) and reflections (colortex5) at a fraction of the
# screen.
#if VOLUMETRIC_RES == 1
size.buffer.colortex4=1.0 1.0
#elif VOLUMETRIC_RES == 3
size.buffer.colortex4=0.3334 0.3334
#elif VOLUMETRIC_RES == 4
size.buffer.colortex4=0.25 0.25
#else
size.buffer.colortex4=0.5 0.5
#endif
#if REFLECTION_RES == 1
size.buffer.colortex5=1.0 1.0
#elif REFLECTION_RES == 3
size.buffer.colortex5=0.3334 0.3334
#elif REFLECTION_RES == 4
size.buffer.colortex5=0.25 0.25
#else
size.buffer.colortex5=0.5 0.5
#endif

# Lit as drawn: the texel target must not blend.
blend.gbuffers_textured.colortex2=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_water.colortex3=off

screen=SUN_BRIGHTNESS TORCH_BRIGHTNESS EXPOSURE FOG_DENSITY WATER_CLARITY WATER_SURFACE_OPACITY GOD_RAY_STEPS REFLECTION_STEPS SHADOW_SOFTNESS <empty> REFLECTION_RES VOLUMETRIC_RES SCALED_RESOLVE <empty> TEXEL_FULL_DISTANCE TEXEL_RING_WIDTH TEXEL_MIN_RES TEXEL_DENOISE TEXEL_DENOISE_RES TEXEL_TEMPORAL TEXEL_TEMPORAL_POINTS
sliders=WATER_CLARITY WATER_SURFACE_OPACITY TEXEL_FULL_DISTANCE TEXEL_RING_WIDTH TEXEL_MIN_RES TEXEL_DENOISE TEXEL_DENOISE_RES TEXEL_TEMPORAL TEXEL_TEMPORAL_POINTS
