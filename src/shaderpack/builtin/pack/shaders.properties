# Torch Vibrant: the built-in pack, written in Slang for this engine.

# The deferred pass paints the sky; only the stars, sun and moon are drawn.
sky=false
sun=true
moon=true
stars=true

shadowTerrain=true
shadowTranslucent=false
shadowSolidBackFaces=true
shadowEntities=true
shadowBlockEntities=true

oldLighting=false
separateAo=false

# The texel cache: a count, then keys, shades and the work list, then the
# coarse table's keys and shades, each 2^20 entries. Not on Android, whose PowerVR driver aborts on the depth
# texture its compute passes read: `deferred` looks shadows up per pixel
# there instead.
#ifdef MC_OS_ANDROID
program.prepare.enabled=false
program.deferred_a.enabled=false
program.deferred_b.enabled=false
#else
bufferObject.0=20971536
# The texel shadows' temporal history: a tag and a packed shade (16 bits),
# sample count (8) and last frame seen (8) for each of 2^20 slots, kept
# from frame to frame.
bufferObject.1=8388608
#endif

# Light shafts (colortex4) at a fraction of the screen.
#if VOLUMETRIC_RES == 1
size.buffer.colortex4=1.0 1.0
#elif VOLUMETRIC_RES == 3
size.buffer.colortex4=0.3334 0.3334
#elif VOLUMETRIC_RES == 4
size.buffer.colortex4=0.25 0.25
#else
size.buffer.colortex4=0.5 0.5
#endif

# Lit as drawn: the texel target must not blend.
blend.gbuffers_textured.colortex2=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_water.colortex3=off

# The options screen: a page per topic, sliders first on each, then the
# choices that are buttons.
screen=[LIGHTING] [WATER] [CLOUDS] [TEXELS] [PERFORMANCE]
screen.LIGHTING=SUN_BRIGHTNESS TORCH_BRIGHTNESS EXPOSURE SHADOW_SOFTNESS FOG_DENSITY
screen.WATER=WATER_CLARITY WATER_SURFACE_OPACITY WATER_CAUSTICS WATER_CAUSTICS_DEPTH WATER_CAUSTICS_SHADE GLINT_SMOOTHNESS REFLECTION_STRENGTH <empty> WATER_CAUSTICS_ENABLED WATER_STYLE WATER_COLOR_MAPPING WATER_REFLECTIONS REFLECTION_QUALITY
screen.CLOUDS=CLOUD_STYLE CLOUD_BLEND_DISTANCE CLOUD_SCATTER torchCloudUpper
screen.TEXELS=TEXEL_FULL_DISTANCE TEXEL_RING_WIDTH TEXEL_MIN_RES TEXEL_DENOISE TEXEL_DENOISE_RES TEXEL_TEMPORAL TEXEL_TEMPORAL_POINTS
screen.PERFORMANCE=shadowMapResolution shadowDistance torchShadowCache torchShadowStep torchShadowLerp GOD_RAY_STEPS VOLUMETRIC_RES FOLIAGE_SHADING <empty> SCALED_RESOLVE
sliders=CLOUD_BLEND_DISTANCE CLOUD_SCATTER shadowMapResolution shadowDistance torchShadowStep SUN_BRIGHTNESS TORCH_BRIGHTNESS EXPOSURE SHADOW_SOFTNESS FOG_DENSITY WATER_CLARITY WATER_SURFACE_OPACITY WATER_CAUSTICS WATER_CAUSTICS_DEPTH WATER_CAUSTICS_SHADE GLINT_SMOOTHNESS REFLECTION_STRENGTH GOD_RAY_STEPS VOLUMETRIC_RES TEXEL_FULL_DISTANCE TEXEL_RING_WIDTH TEXEL_MIN_RES TEXEL_DENOISE TEXEL_DENOISE_RES TEXEL_TEMPORAL TEXEL_TEMPORAL_POINTS
