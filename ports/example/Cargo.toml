[package]
name = "torch-port-example"
version = "0.1.0"
edition = "2024"
description = "The template port: spins a model on one block entity type (docs/porting/AGENT_GUIDE.md)"
license = "MIT"
publish = false

# Its own workspace: ports build for wasm32, never with the client.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
torch-mod-api = { path = "../../crates/torch-mod-api" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
