# The game as its own Android app for benchmarks (com.torch.bench), so test
# builds install beside the real game (com.torch.client), never over it.
# `run.sh` builds it, points it at a local server through `adb reverse`, and
# collects the perf log. The game lives in the main crate; this crate only
# gives cargo-apk a package of its own.
[package]
name = "bench-apk"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
torch-client = { path = "../..", features = ["mobile_ui"] }

[package.metadata.android]
package = "com.torch.bench"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 36

[package.metadata.android.application]
label = "Torch Bench"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation|uiMode|density|touchscreen"

# The main crate's patches, which a dependent crate doesn't inherit.
[patch.crates-io]
bevy_camera = { path = "../../vendor/bevy_camera" }
simdnbt = { path = "../../vendor/simdnbt" }

[profile.release]
strip = true
